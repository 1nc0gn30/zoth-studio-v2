functionsDirectory = "/home/zoth/NullAITech/zoth-studio-v2/netlify/functions"
functionsDirectoryOrigin = "config-v1"
headersOrigin = "config"
redirectsOrigin = "config"
plugins = []

[build]
publish = "/home/zoth/NullAITech/zoth-studio-v2/dist"
publishOrigin = "config"
commandOrigin = "config"
command = "npm run build"
functions = "/home/zoth/NullAITech/zoth-studio-v2/netlify/functions"

[build.environment]
NODE_VERSION = "20"
NPM_FLAGS = "--no-audit"

[build.processing]
skip_processing = false

[build.processing.css]
bundle = true
minify = true

[build.processing.html]
pretty_urls = true

[build.processing.images]
compress = true

[build.processing.js]
bundle = true
minify = true

[build.services]

[site]
prerender = true

[functions]

[functions."*"]

[[headers]]
for = "/*"

[headers.values]
X-Frame-Options = "SAMEORIGIN"
Content-Security-Policy = "frame-ancestors 'self' https://zoth.nullai.tech https://*.nullai.tech http://127.0.0.1:* http://localhost:*"
X-Content-Type-Options = "nosniff"
Referrer-Policy = "strict-origin-when-cross-origin"
Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
Cross-Origin-Opener-Policy = "same-origin"
Cross-Origin-Embedder-Policy = "credentialless"

[[headers]]
for = "/assets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/fonts/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/brand/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/mascot/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/pets/*"

[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
for = "/sitemap.xml"

[headers.values]
Content-Type = "application/xml; charset=UTF-8"
Access-Control-Allow-Origin = "*"
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/robots.txt"

[headers.values]
Content-Type = "text/plain; charset=UTF-8"
Access-Control-Allow-Origin = "*"
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/llms.txt"

[headers.values]
Content-Type = "text/plain; charset=UTF-8"
Access-Control-Allow-Origin = "*"
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/llms-full.txt"

[headers.values]
Content-Type = "text/plain; charset=UTF-8"
Access-Control-Allow-Origin = "*"
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/ai.txt"

[headers.values]
Content-Type = "text/plain; charset=UTF-8"
Access-Control-Allow-Origin = "*"
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/api/*"

[headers.values]
Content-Type = "application/json; charset=UTF-8"
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET, OPTIONS"
Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
for = "/.well-known/*"

[headers.values]
Content-Type = "application/json; charset=UTF-8"
Access-Control-Allow-Origin = "*"
Access-Control-Allow-Methods = "GET, OPTIONS"
Cache-Control = "public, max-age=3600, must-revalidate"

[[redirects]]
from = "/api/studio/*"
to = "/.netlify/functions/studio-api/:splat"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/hub"
to = "/"
status = 301.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/hub/*"
to = "/:splat"
status = 301.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]

[[redirects]]
from = "/*"
to = "/index.html"
status = 200.0
force = false

[redirects.query]

[redirects.conditions]

[redirects.headers]