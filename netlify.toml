# ==============================================================================
# ⚡ ZOTH STUDIO v2 — Netlify Production Configuration
# Zero-Egress Enclave, Prerendered Static Multi-Route, AEO, and Security Headers
# ==============================================================================

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit"

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.images]
  compress = true

[site]
  prerender = true

# ── API Serverless Proxy for Hosted Mode ──
[[redirects]]
  from = "/api/studio/*"
  to = "/.netlify/functions/studio-api/:splat"
  status = 200

# ── Legacy Hub Aliases ──
[[redirects]]
  from = "/hub"
  to = "/"
  status = 301

[[redirects]]
  from = "/hub/*"
  to = "/:splat"
  status = 301

# ── SPA Client-Side Fallback (Static files in dist/ take precedence) ──
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Global Security & Frame Headers ──
# CSP sources are the ones the studio actually loads:
#   fonts.googleapis.com / fonts.gstatic.com — index.html font stylesheet
#   huggingface.co + LFS/Xet CDNs — in-browser Transformers.js weights (WebGPU, else WASM)
#   loopback ports — Ollama, voice station, and the local daemon health checks
#   api.producthunt.com — ZothOS showcase badge image
#   wasm-unsafe-eval — WebGPU WASM fallback and ONNX runtime compilation
#   blob workers — Transformers.js / ONNX threads
# The capsule sandbox worker is a separate file so 'unsafe-eval' stays off the document.
# Camera and microphone stay same-origin: the gesture workstation and voice station use them.
# Loopback origins are not frame-ancestors; a local page must not embed the public site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://api.producthunt.com; media-src 'self' blob: mediastream:; connect-src 'self' https://huggingface.co https://cdn-lfs.huggingface.co https://cdn-lfs-us-1.huggingface.co https://cas-bridge.xethub.hf.co http://127.0.0.1:11434 http://localhost:11434 http://127.0.0.1:8114 http://localhost:8114 http://127.0.0.1:8098 http://localhost:8098 http://127.0.0.1:8104 http://localhost:8104 http://127.0.0.1:8115 http://localhost:8115 http://127.0.0.1:8116 http://localhost:8116 http://127.0.0.1:8108 http://localhost:8108 http://127.0.0.1:8113 http://localhost:8113 http://127.0.0.1:8107 http://localhost:8107 http://127.0.0.1:8117 http://localhost:8117 http://127.0.0.1:8118 http://localhost:8118 http://127.0.0.1:8119 http://localhost:8119 http://127.0.0.1:8120 http://localhost:8120 http://127.0.0.1:8109 http://localhost:8109 http://127.0.0.1:8110 http://localhost:8110; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; frame-ancestors 'self' https://zoth.nullai.tech https://*.nullai.tech"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    Cross-Origin-Resource-Policy = "same-site"
    Strict-Transport-Security = "max-age=31536000"
    X-Permitted-Cross-Domain-Policies = "none"

# ── Immutable Cache for Hashed Bundles & Media ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/brand/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/mascot/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/pets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── AI Crawlers & Answer Engine Discovery Headers (CORS Enabled) ──
[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/llms-full.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/ai.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Content-Type = "application/json; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/.well-known/*"
  [headers.values]
    Content-Type = "application/json; charset=UTF-8"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Cache-Control = "public, max-age=3600, must-revalidate"

# Last matching CSP wins. This file is the only response allowed to compile
# operator snippets; the document policy above does not include unsafe-eval.
[[headers]]
  for = "/workers/capsule-worker.js"
  [headers.values]
    Content-Security-Policy = "default-src 'none'; script-src 'self' 'unsafe-eval'; connect-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"

